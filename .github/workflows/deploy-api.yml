name: Deploy da API (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Domínios do front liberados na API. Configure em Settings > Secrets and variables > Actions > Variables
      FRONT_URLS: ${{ vars.FRONT_URLS || secrets.FRONT_URLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

      - name: Conferir segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cadastre os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Garantir o banco D1
        run: |
          ID=$(npx wrangler d1 list --json | node -e '
            const l = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const d = l.find((x) => x.name === "reembolsos");
            process.stdout.write(d ? (d.uuid || d.id || d.database_id) : "");')
          if [ -z "$ID" ]; then
            echo "Criando o banco D1 reembolsos"
            npx wrangler d1 create reembolsos
            ID=$(npx wrangler d1 list --json | node -e '
              const l = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const d = l.find((x) => x.name === "reembolsos");
              process.stdout.write(d ? (d.uuid || d.id || d.database_id) : "");')
          fi
          if [ -z "$ID" ]; then echo "::error::Não foi possível obter o ID do banco D1."; exit 1; fi
          echo "Banco D1: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Garantir o bucket R2
        run: |
          if npx wrangler r2 bucket list | grep -q "reembolsos-anexos"; then
            echo "Bucket reembolsos-anexos já existe"
          else
            npx wrangler r2 bucket create reembolsos-anexos
          fi

      - name: Aplicar migrações do banco
        run: npx wrangler d1 migrations apply reembolsos --remote

      - name: Publicar Worker
        run: |
          if [ -z "$FRONT_URLS" ]; then
            echo "::warning::FRONT_URLS está vazia. A API só vai aceitar chamadas de localhost. Crie FRONT_URLS em Settings > Secrets and variables > Actions."
          fi
          # Remove espaços e barras no final de cada endereço
          ORIGENS=$(echo "${FRONT_URLS:-http://localhost:5173}" | tr -d ' ' | sed -E 's#/+(,|$)#\1#g')
          echo "Origens liberadas: $ORIGENS"
          npx wrangler deploy --var "ALLOWED_ORIGINS:$ORIGENS"
